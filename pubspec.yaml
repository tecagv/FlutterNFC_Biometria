name: flutter_nfc_biometria_educacional
description: Projeto didatico Flutter para NFC, biometria local e deteccao facial com ML Kit.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  nfc_manager:
    path: ./plugins/nfc_manager
  local_auth: ^3.0.1
  google_mlkit_face_detection: ^0.13.2
  image_picker: ^1.2.2
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
